
name: Android CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean Broken References from Code
      run: |
        # build.gradle içinden kütüphaneyi sil
        sed -i '/android-wear-color-picker/d' app/build.gradle || true
        sed -i '/android-wear-color-picker/d' build.gradle || true
        
        # Java/Kotlin dosyalarındaki kütüphane çağrılarını temizle
        find app/src/main/java -type f -exec sed -i '/org.jraf.android.androidwearcolorpicker/d' {} + || true

    - name: Build APK
      run: ./gradlew assembleDebug --continue

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pear-watch-face-apk
        path: '**/*.apk'
