name: Android CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Kill Dependency via Gradle Exclude
      run: |
        # app/build.gradle dosyasının en altına o kütüphaneyi dışlayan (exclude eden) kuralı ekliyoruz
        echo "" >> app/build.gradle
        echo "configurations.all { exclude group: 'org.jraf.android', module: 'android-wear-color-picker' }" >> app/build.gradle

    - name: Build APK
      run: ./gradlew assembleDebug --continue

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pear-watch-face-apk
        path: '**/*.apk'
